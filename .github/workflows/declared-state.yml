name: Declared State Guardrail

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  declared-state:
    name: Declared state vs reality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: none

      - name: Check declared state
        run: php scripts/ci/check-declared-state.php
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
