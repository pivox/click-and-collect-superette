; Kadhia backend — production PHP configuration.
;
; Loaded from /usr/local/etc/php/conf.d/ (see docker/backend/Dockerfile.prod),
; so every directive here overrides the php:8.4-fpm-alpine defaults.
; Development keeps the image defaults: docker/backend/Dockerfile does not copy
; this file.

; --- Error handling ---------------------------------------------------------
; Never leak stack traces, file paths or SQL to API clients. Symfony renders
; its own JSON / problem+json error bodies in prod.
display_errors = Off
display_startup_errors = Off
log_errors = On
; php-fpm's own stderr, collected by the container runtime (docker logs).
; Application-level logs go through Monolog to var/log (see monolog.yaml).
error_log = /proc/self/fd/2
; E_STRICT is deprecated in PHP 8.4 and must not be referenced here.
error_reporting = E_ALL & ~E_DEPRECATED

; --- Hardening --------------------------------------------------------------
expose_php = Off

; --- Limits -----------------------------------------------------------------
; GD decodes a 2 MB source image and writes several responsive WebP variants
; plus a JPEG fallback (S13-005); 128M is too tight for that pipeline.
memory_limit = 256M
; Long tail: merchant CSV export and QR PDF generation. Kept strictly below the
; edge FastCGI read timeout (90s in docker/caddy/Caddyfile) so that PHP fails
; first with a real error instead of the proxy returning a bare 504.
max_execution_time = 60
max_input_time = 60

; --- Uploads ----------------------------------------------------------------
; Deliberate ordering of the three gates on product image upload:
;   application  2 MB  (app.product_image.max_upload_bytes)  -> proper 4xx body
;   edge         4 MB  (Caddy request_body / nginx client_max_body_size)
;   PHP          6 MB  (below)
; PHP is the most permissive so the *application* produces the error message.
; If PHP were the tightest gate the client would get an opaque 413 instead.
upload_max_filesize = 6M
post_max_size = 8M
max_file_uploads = 20

; --- Filesystem -------------------------------------------------------------
; Large vendor tree, immutable sources: a generous realpath cache pays off once
; opcache stops validating timestamps.
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; --- OPcache ----------------------------------------------------------------
[opcache]
opcache.enable = 1
; The messenger worker is a long-running CLI process, but opcache in CLI brings
; nothing here and complicates memory accounting against --memory-limit=128M.
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
; Symfony + API Platform + Doctrine easily exceed the 10k default.
opcache.max_accelerated_files = 20000
; Production mode: application sources are immutable inside the image, a new
; release is a new image, so PHP must never stat them again.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
; MUST stay enabled: phpdocumentor/reflection-docblock and symfony/property-info
; read docblocks at runtime to build serialization/validation metadata.
opcache.save_comments = 1
; JIT is intentionally left disabled (PHP 8.4 default). It brings close to
; nothing on an I/O-bound API and adds a class of hard-to-debug failures.

; --- Timezone ---------------------------------------------------------------
; date.timezone is intentionally NOT set: it would change the process default
; timezone compared to development (UTC) and that is a functional change, not a
; deployment concern. Business timezone handling stays explicit in the code.
