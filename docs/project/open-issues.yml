# Issues GitHub déclarées ouvertes — source de vérité vérifiable
#
# Ce fichier est le point de contrôle du garde-fou CI
# (`scripts/ci/check-declared-state.php`, workflow `declared-state.yml`).
# Il remplace toute tentative d'extraire les numéros d'issues de la prose
# d'`AI_CONTEXT.md` : ce document narratif cite aussi des dizaines de numéros
# de PR, l'extraction fiable y est impossible.
#
# Règles :
#   - toute issue listée ici doit être réellement ouverte sur
#     `pivox/click-and-collect-superette` ;
#   - toute issue réellement ouverte doit être listée ici.
#   Les deux sens font échouer la CI. C'est l'oubli du second sens qui a fait
#   rater l'épic CATALOG-AI #637-#649 pendant plusieurs mois.
#
# Format accepté (sous-ensemble YAML volontairement étroit, voir
# `docs/project/declared-state-guardrail.md`) :
#   repository: owner/name
#   issues:
#     - number: 527
#       title: "libellé court"
#       note: "contexte optionnel"
#
# `title` et `note` sont informatifs : le garde-fou ne vérifie que `number`.
# Mettre à jour ce fichier fait partie de la clôture ou de l'ouverture d'une
# issue, pas d'une passe d'audit trimestrielle.
#
# État vérifié contre l'API GitHub le 14 octobre 2026 : 19 issues ouvertes.

