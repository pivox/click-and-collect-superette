# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.password_reset_token_ttl: 3600
    app.frontend_url: '%env(string:FRONTEND_URL)%'
    app.mailer_from_email: '%env(string:MAILER_FROM_EMAIL)%'
    app.mailer_from_name: '%env(string:MAILER_FROM_NAME)%'
    app.merchant_response_timeout_lead_seconds: 7200
    app.partial_acceptance_reminder_lead_seconds: 14400
    app.partial_acceptance_expiration_lead_seconds: 7200
    app.diagnostics.allow_non_count_aware_messenger_transport: false
    app.messenger_async_queue_name_default: default
    app.messenger_async_queue_name: '%env(default:app.messenger_async_queue_name_default:string:MESSENGER_ASYNC_QUEUE_NAME)%'
    app.messenger_monitor.pending_threshold_default: 100
    app.messenger_monitor.oldest_age_threshold_seconds_default: 900
    app.messenger_monitor.redeliver_timeout_seconds_default: 3600
    app.messenger_monitor.pending_threshold: '%env(default:app.messenger_monitor.pending_threshold_default:int:MESSENGER_MONITOR_PENDING_THRESHOLD)%'
    app.messenger_monitor.oldest_age_threshold_seconds: '%env(default:app.messenger_monitor.oldest_age_threshold_seconds_default:int:MESSENGER_MONITOR_OLDEST_AGE_THRESHOLD_SECONDS)%'
    app.messenger_monitor.redeliver_timeout_seconds: '%env(default:app.messenger_monitor.redeliver_timeout_seconds_default:int:MESSENGER_MONITOR_REDELIVER_TIMEOUT_SECONDS)%'
    app.store_activation.minimum_catalog_products_default: 5
    app.store_activation.minimum_catalog_products: '%env(default:app.store_activation.minimum_catalog_products_default:int:STORE_ACTIVATION_MINIMUM_CATALOG_PRODUCTS)%'
    # Product image pipeline (S13-005 / US-041)
    app.product_image.upload_dir: '%kernel.project_dir%/public/uploads/products'
    app.product_image.public_path_prefix: '/uploads/products'
    # Optional absolute base URL (CDN / object storage origin). Empty → relative
    # paths resolved by the frontend against the API origin.
    app.product_image.public_base_url_default: ''
    app.product_image.public_base_url: '%env(default:app.product_image.public_base_url_default:string:PRODUCT_IMAGE_BASE_URL)%'
    app.product_image.max_upload_bytes: 2097152
    app.product_image.min_dimension: 400
    # Catalogue photo import (S13-001). Empty API key makes the endpoint return
    # a clear 503 instead of attempting an external call.
    app.openai.api_key_default: ''
    app.openai.api_key: '%env(default:app.openai.api_key_default:string:OPENAI_API_KEY)%'
    app.catalog_photo_import.model_default: 'gpt-4o-mini'
    app.catalog_photo_import.model: '%env(default:app.catalog_photo_import.model_default:string:OPENAI_CATALOG_PHOTO_IMPORT_MODEL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            int $passwordResetTokenTtl: '%app.password_reset_token_ttl%'
            string $frontendUrl: '%app.frontend_url%'
            string $mailerFromEmail: '%app.mailer_from_email%'
            string $mailerFromName: '%app.mailer_from_name%'
            int $merchantResponseTimeoutLeadSeconds: '%app.merchant_response_timeout_lead_seconds%'
            int $partialAcceptanceReminderLeadSeconds: '%app.partial_acceptance_reminder_lead_seconds%'
            int $partialAcceptanceExpirationLeadSeconds: '%app.partial_acceptance_expiration_lead_seconds%'
            string $asyncQueueName: '%app.messenger_async_queue_name%'
            int $pendingThreshold: '%app.messenger_monitor.pending_threshold%'
            int $oldestAgeSecondsThreshold: '%app.messenger_monitor.oldest_age_threshold_seconds%'
            int $redeliverTimeoutSeconds: '%app.messenger_monitor.redeliver_timeout_seconds%'
            int $minimumCatalogProducts: '%app.store_activation.minimum_catalog_products%'
            string $catalogPhotoImportOpenAiApiKey: '%app.openai.api_key%'
            string $catalogPhotoImportOpenAiModel: '%app.catalog_photo_import.model%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Monolog\CorrelationIdProcessor:
        tags:
            - { name: monolog.processor }

    App\OpenApi\JwtOpenApiDecorator:
        decorates: 'api_platform.openapi.factory'
        arguments: ['@.inner']

    App\Service\PasswordResetTokenSenderInterface:
        alias: App\Service\PasswordResetTokenEmailSender

    App\Email\TransactionalEmailSenderInterface:
        alias: App\Email\SymfonyMailerTransactionalEmailSender

    App\Service\MerchantCatalogPhotoImportExtractorInterface:
        alias: App\Service\OpenAiMerchantCatalogPhotoImportExtractor

    App\Billing\MerchantPaymentReminderEmailSenderInterface:
        alias: App\Billing\MerchantPaymentReminderEmailSender

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    parameters:
        # Keep uploaded test fixtures out of the public web root.
        app.product_image.upload_dir: '%kernel.cache_dir%/product-image-uploads'

    services:
        App\Doctrine\Middleware\SQLiteUnaccentMiddleware:
            tags:
                - { name: doctrine.middleware }

        App\Tests\Support\CatalogPhotoImport\TestMerchantCatalogPhotoImportExtractor: ~

        App\Service\MerchantCatalogPhotoImportExtractorInterface:
            alias: App\Tests\Support\CatalogPhotoImport\TestMerchantCatalogPhotoImportExtractor
