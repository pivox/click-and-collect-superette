parameters:
    app.diagnostics.allow_non_count_aware_messenger_transport: true
    # No resend cooldown in tests: rotation must be exercisable immediately.
    app.merchant_team_invitation_resend_cooldown: 0

services:
    App\Service\SocialOAuthProvider:
        autowire: true
        public: true

    App\Tests\Support\Security\TestAuthenticator:
        autowire: true
        autoconfigure: true

    App\Tests\Support\PasswordReset\TestPasswordResetTokenSender: ~

    App\Service\PasswordResetTokenSenderInterface:
        alias: App\Tests\Support\PasswordReset\TestPasswordResetTokenSender
        public: true

    App\Tests\Support\MerchantInvitation\TestMerchantInvitationSender: ~

    App\Service\MerchantInvitationSenderInterface:
        alias: App\Tests\Support\MerchantInvitation\TestMerchantInvitationSender
        public: true
